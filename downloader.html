<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download video</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      .top {
        max-width: 760px;
        margin: 0 auto;
        padding: 22px 20px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 18px 20px 48px;
        display: grid;
        gap: 14px;
      }
      .hero {
        padding: 22px;
        display: grid;
        gap: 20px;
        box-shadow: var(--shadow);
      }
      .hero-head {
        display: flex;
        gap: 16px;
        align-items: center;
        min-width: 0;
      }
      .hero-head > div {
        min-width: 0;
        display: grid;
        gap: 8px;
      }
      h1 {
        font-size: 21px;
        line-height: 1.25;
        letter-spacing: -0.015em;
        overflow-wrap: anywhere;
      }
      .progress-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      #phase {
        font-weight: 600;
        color: var(--text-2);
      }
      #percent {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .coverage {
        display: block;
        width: 100%;
        height: 14px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 16px;
      }
      .stat {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        min-width: 0;
      }
      .stat-label {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }
      .stat-value {
        display: block;
        font-weight: 650;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      #hint {
        flex: 1 1 220px;
        font-size: 13px;
        color: var(--muted);
      }
      #notices {
        display: grid;
        gap: 8px;
      }
      #notices:empty {
        display: none;
      }
      details {
        padding: 0 4px;
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
      }
      #log {
        margin: 8px 0 0;
        max-height: 240px;
        overflow: auto;
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color: var(--muted);
      }
      .pace {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        margin-top: 14px;
      }
      .pace-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
      }
      .segmented {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .segmented input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .segmented label {
        padding: 6px 12px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.15s, color 0.15s;
      }
      .segmented label:hover {
        color: var(--text);
        background: var(--surface);
      }
      .segmented .x {
        margin-left: 5px;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .segmented input:checked + label {
        background: var(--gradient);
        color: #fff;
        box-shadow: var(--shadow-sm);
      }
      .segmented input:checked + label .x {
        color: rgba(255, 255, 255, 0.85);
      }
      .segmented input:focus-visible + label {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #pace-note {
        font-size: 12.5px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="logo" id="logo"></span>HLS Stream Downloader</div>
      <span id="status" class="status">Starting</span>
    </header>
    <main class="wrap">
      <section class="card hero">
        <div class="hero-head">
          <div class="thumb lg" id="thumb"></div>
          <div>
            <h1 id="title">Loading…</h1>
            <div class="chips" id="chips"></div>
          </div>
        </div>
        <div>
          <div class="progress-top">
            <span id="phase" aria-live="polite">Loading the video…</span>
            <span id="percent"></span>
          </div>
          <canvas id="coverage" class="coverage" aria-hidden="true"></canvas>
          <div class="stats">
            <div class="stat"><span class="stat-label">Video</span><span class="stat-value" id="s-media">–</span></div>
            <div class="stat"><span class="stat-label">Size</span><span class="stat-value" id="s-size">–</span></div>
            <div class="stat"><span class="stat-label" id="s-speed-label">Rate</span><span class="stat-value" id="s-speed">–</span></div>
            <div class="stat"><span class="stat-label">Time left</span><span class="stat-value" id="s-eta">–</span></div>
          </div>
          <div class="pace" id="pace" hidden>
            <span class="pace-label" id="pace-label">Speed</span>
            <div class="segmented" id="pace-options" role="radiogroup" aria-labelledby="pace-label"></div>
            <span id="pace-note">Changes apply right away.</span>
          </div>
        </div>
        <div class="actions">
          <button id="primary" class="btn primary" hidden></button>
          <button id="secondary" class="btn" hidden></button>
          <span id="hint"></span>
        </div>
      </section>
      <div id="notices"></div>
      <details>
        <summary id="log-summary">Details</summary>
        <pre id="log"></pre>
      </details>
    </main>
    <script src="vendor/mux.min.js"></script>
    <script type="module" src="downloader.js"></script>
  </body>
</html>
